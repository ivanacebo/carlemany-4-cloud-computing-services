name: Format

on:
  pull_request:
    branches:
      - master

jobs:
  format:
    name: black + ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Misma version que la imagen base del proyecto (tiangolo/uvicorn-gunicorn:python3.10)
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install linters
        # Mismas versiones fijadas en requirements/dev.txt. Si cambian alli, cambiarlas aqui.
        run: pip install black==24.1.0 ruff==0.1.14

      - name: Check formatting with black
        run: black --config .black --check --diff .

      - name: Lint with ruff
        # always(): si black falla queremos ver tambien los errores de ruff en la misma ejecucion.
        if: always()
        run: ruff check .
